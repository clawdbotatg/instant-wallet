name: Types

# Type-checks the live app (web/). The old job here built the shelved v2 app in packages/ and never passed.
on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/lint.yaml"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
