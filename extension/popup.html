<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { --bg: #fff; --fg: #111; --dim: #666; --line: #e5e5e5; --green: #1a9a4a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #151515; --fg: #f2f2f2; --dim: #999; --line: #2a2a2a; } }
      body { margin: 0; width: 300px; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
      h1 { font-size: 16px; margin: 0 0 12px; display: flex; gap: 8px; align-items: center; }
      .addr { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
      .dim { color: var(--dim); font-size: 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
      button { font: inherit; border: 1px solid var(--line); background: none; color: var(--fg); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
      button.go { width: 100%; background: var(--green); border-color: var(--green); color: #fff; padding: 8px; margin-top: 8px; }
      #sites:empty::before { content: "No sites yet."; color: var(--dim); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1><img src="icons/32.png" width="20" height="20" alt="" />Instant Wallet</h1>
    <div id="who"></div>
    <div class="row">
      <label for="takeover">Act as MetaMask<div class="dim">Sites that only look for MetaMask get Instant Wallet. Reload them after.</div></label>
      <input type="checkbox" id="takeover" />
    </div>
    <div class="row" style="display: block">
      <div style="margin-bottom: 6px">Connected sites</div>
      <div id="sites"></div>
    </div>
    <button class="go" id="open">Open Instant Wallet</button>
    <script src="popup.js"></script>
  </body>
</html>
