name: Expectations

# EXPECTATIONS.md, checked on the live site after each push to main (web/tools/expect-check.mjs): no hex on screen,
# one green button per page, money with − or +. After the push, not before (ship first, test after).
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "packages/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Vercel to deploy it
        # until /api/version shows this commit; 8 min at most (a later push can skip ours: then check what's live)
        run: |
          for i in $(seq 48); do
            curl -s https://instantwallet.io/api/version | grep -q "$GITHUB_SHA" && exit 0
            sleep 10
          done
          echo "not seen after 8 min; checking what's live"
      - name: Check the live site
        run: |
          mkdir -p /tmp/x && cp web/tools/expect-check.mjs /tmp/x/ && cd /tmp/x
          npm init -y >/dev/null && npm i playwright-core@1.56 >/dev/null
          CHROME=$(which google-chrome) node expect-check.mjs
