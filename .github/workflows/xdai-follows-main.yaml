# The xdai.io preview link (instant-wallet-b2jn-git-xdai-buidlguidldao.vercel.app) builds from the xdai branch.
# Keep that branch equal to main so the link always shows main.
name: xdai follows main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:refs/heads/xdai
