name: Dashboard totals

# Keeps the private dashboard's totals fresh (web/app/api/dash): reads the chains every 10 minutes. The call answers
# no numbers.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS --fail --max-time 70 https://instantwallet.io/api/dash
