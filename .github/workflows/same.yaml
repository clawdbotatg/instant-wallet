name: Same everywhere

# EXPECTATIONS.md #2 in the code: anything hand-drawn that has a shared part in components/bits.tsx fails.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/tools/same-check.mjs
